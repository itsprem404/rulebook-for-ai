<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">Rulebook for AI</title>
  <desc id="d">The Agentic Engineering Standard. Behavioral guidelines and engineering standards for Claude Code, Cursor, Windsurf, Copilot, and Antigravity agents.</desc>
  <style>
    .contours{transform-box:view-box;transform-origin:1150px 132px;animation:spin 160s linear infinite}
    .flow{animation:flow 1.6s linear infinite}
    .trail{animation:trail 9s cubic-bezier(.45,.05,.4,1) infinite}
    .pip{offset-path:path("M 700 390 C 810 410, 840 260, 950 250 S 1030 180, 1060 160");offset-rotate:0deg;animation:fly 9s cubic-bezier(.45,.05,.4,1) infinite}
    .bob{animation:bob 1.1s ease-in-out infinite alternate}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 9s ease-out infinite}
    .ring2{animation-delay:.35s}
    .pin{transform-box:fill-box;transform-origin:50% 100%;animation:land 9s ease-out infinite}
    .cmd{opacity:0}
    .caret{animation:blink 1s steps(1) infinite}
    .rise{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes fly{0%{offset-distance:0%;opacity:0}6%{opacity:1}70%{offset-distance:100%;opacity:1}78%,100%{offset-distance:100%;opacity:0}}
    @keyframes trail{0%{stroke-dashoffset:1;opacity:.9}70%{stroke-dashoffset:0;opacity:.9}90%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
    @keyframes ring{0%,68%{transform:scale(.2);opacity:0}72%{opacity:.8}96%,100%{transform:scale(2.6);opacity:0}}
    @keyframes land{0%,68%{transform:scale(1)}72%{transform:scale(1.22)}78%,100%{transform:scale(1)}}
    @keyframes show{0%,14.67%{opacity:1}16.67%,100%{opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    .c0{animation:show 18.0s linear 0s infinite}.v0{animation:t0 18.0s 0s infinite}@keyframes t0{0%{transform:translateX(0);animation-timing-function:steps(24,end)}3.3%,100%{transform:translateX(300px)}}
    .c1{animation:show 18.0s linear 3s infinite}.v1{animation:t1 18.0s 3s infinite}@keyframes t1{0%{transform:translateX(0);animation-timing-function:steps(20,end)}3.3%,100%{transform:translateX(250px)}}
    .c2{animation:show 18.0s linear 6s infinite}.v2{animation:t2 18.0s 6s infinite}@keyframes t2{0%{transform:translateX(0);animation-timing-function:steps(22,end)}3.3%,100%{transform:translateX(270px)}}
    .c3{animation:show 18.0s linear 9s infinite}.v3{animation:t3 18.0s 9s infinite}@keyframes t3{0%{transform:translateX(0);animation-timing-function:steps(25,end)}3.3%,100%{transform:translateX(310px)}}
    .c4{animation:show 18.0s linear 12s infinite}.v4{animation:t4 18.0s 12s infinite}@keyframes t4{0%{transform:translateX(0);animation-timing-function:steps(19,end)}3.3%,100%{transform:translateX(240px)}}
    .c5{animation:show 18.0s linear 15s infinite}.v5{animation:t5 18.0s 15s infinite}@keyframes t5{0%{transform:translateX(0);animation-timing-function:steps(19,end)}3.3%,100%{transform:translateX(240px)}}

    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-reduced-motion: reduce){.c0{opacity:1}.v0{transform:translateX(300px)}.pip{offset-distance:62%}.trail{stroke-dashoffset:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2229"/><stop offset="1" stop-color="#15333C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#9FE0CF" stop-opacity=".18"/>
      <stop offset="60%" stop-color="#2A9D8F" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#0F2229" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trailg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FE0CF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9FE0CF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#F4704F" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="480" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#glow)"/>

    <!-- Subtle Topographic Contours in the background -->
    <g class="contours" fill="none" stroke="#9FE0CF" stroke-opacity=".075" stroke-width="1.2">
      <ellipse cx="1150" cy="132" rx="60" ry="45"/>
      <ellipse cx="1150" cy="132" rx="140" ry="105"/>
      <ellipse cx="1150" cy="132" rx="230" ry="175"/>
      <ellipse cx="1150" cy="132" rx="340" ry="260"/>
      <ellipse cx="1150" cy="132" rx="460" ry="350"/>
      <ellipse cx="1150" cy="132" rx="600" ry="460"/>
    </g>

    <!-- LEFT COLUMN: Typography & Animated Terminal -->
    <g class="rise">
      <!-- Main Display Title -->
      <text x="88" y="188" font-family="ui-rounded,'SF Pro Rounded','Nunito','Varela Round','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="78" font-weight="800" letter-spacing="-2.2" fill="#EEF3EF">Rulebook for AI</text>
    </g>
    
    <g class="rise d1">
      <!-- Subtitle -->
      <text x="92" y="244" font-family="ui-rounded,'SF Pro Rounded','Nunito','Varela Round','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="27" font-weight="500" fill="#9FE0CF" fill-opacity=".92">The Agentic Engineering Standard.</text>
    </g>

    <g class="rise d2">
      <!-- Terminal Prompt Pill -->
      <rect x="92" y="298" width="510" height="52" rx="14" fill="#0A1A20" stroke="#9FE0CF" stroke-opacity=".18" stroke-width="1.2"/>
      <text x="114" y="333" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#F4704F">›</text>

      <!-- Command 0 -->
      <g class="cmd c0">
        <text x="142" y="333" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" fill="#EEF3EF">/plugin install rulebook-for-ai</text>
        <g class="v0">
          <rect x="142" y="306" width="370" height="36" fill="#0A1A20"/>
          <rect class="caret" x="142" y="312" width="10" height="25" rx="2" fill="#9FE0CF"/>
        </g>
      </g>

      <!-- Command 1 -->
      <g class="cmd c1">
        <text x="142" y="333" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" fill="#EEF3EF">curl -o AGENTS.md &lt;source&gt;</text>
        <g class="v1">
          <rect x="142" y="306" width="370" height="36" fill="#0A1A20"/>
          <rect class="caret" x="142" y="312" width="10" height="25" rx="2" fill="#9FE0CF"/>
        </g>
      </g>

      <!-- Command 2 -->
      <g class="cmd c2">
        <text x="142" y="333" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" fill="#EEF3EF">@skill:rulebook-for-ai</text>
        <g class="v2">
          <rect x="142" y="306" width="370" height="36" fill="#0A1A20"/>
          <rect class="caret" x="142" y="312" width="10" height="25" rx="2" fill="#9FE0CF"/>
        </g>
      </g>

      <!-- Command 3 -->
      <g class="cmd c3">
        <text x="142" y="333" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" fill="#EEF3EF">eval "medicine on the shelf"</text>
        <g class="v3">
          <rect x="142" y="306" width="370" height="36" fill="#0A1A20"/>
          <rect class="caret" x="142" y="312" width="10" height="25" rx="2" fill="#9FE0CF"/>
        </g>
      </g>

      <!-- Command 4 -->
      <g class="cmd c4">
        <text x="142" y="333" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" fill="#EEF3EF">audit --purge-zombie-scrap</text>
        <g class="v4">
          <rect x="142" y="306" width="370" height="36" fill="#0A1A20"/>
          <rect class="caret" x="142" y="312" width="10" height="25" rx="2" fill="#9FE0CF"/>
        </g>
      </g>

      <!-- Command 5 -->
      <g class="cmd c5">
        <text x="142" y="333" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" fill="#EEF3EF">spar --destination-over-vehicle</text>
        <g class="v5">
          <rect x="142" y="306" width="370" height="36" fill="#0A1A20"/>
          <rect class="caret" x="142" y="312" width="10" height="25" rx="2" fill="#9FE0CF"/>
        </g>
      </g>

      <!-- Bottom Tagline -->
      <text x="92" y="394" font-family="ui-rounded,'SF Pro Rounded','Nunito','Varela Round','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" fill="#EEF3EF" fill-opacity=".55">Built for Claude Code, Cursor, Windsurf, Copilot, Antigravity.</text>
    </g>

    <!-- RIGHT COLUMN: Elegant Modular Flow Architecture -->
    <!-- Base dashed flow curve -->
    <path d="M 700 390 C 810 410, 840 260, 950 250 S 1030 180, 1060 160" fill="none" stroke="#9FE0CF" stroke-opacity=".3" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 11" class="flow"/>
    <!-- Animated luminous gradient trail -->
    <path d="M 700 390 C 810 410, 840 260, 950 250 S 1030 180, 1060 160" pathLength="1" fill="none" stroke="url(#trailg)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 1" class="trail"/>

    <!-- Modular Block 1: Raw Prompt / Source -->
    <g transform="translate(680, 360)">
      <g transform="rotate(-6)">
        <rect x="0" y="0" width="70" height="42" rx="8" fill="#0A1A20" stroke="#9fb3ab" stroke-width="1.4"/>
        <text x="35" y="26" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#9FE0CF" text-anchor="middle">Task</text>
      </g>
    </g>

    <!-- Modular Block 2: Lego Primitives ("Medicine on the Shelf") -->
    <g transform="translate(850, 240)">
      <!-- Card A -->
      <g transform="rotate(-8)">
        <rect x="-10" y="5" width="100" height="44" rx="8" fill="#d9e3de" stroke="#9fb3ab" stroke-width="1.5"/>
        <text x="40" y="31" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#0F2229" text-anchor="middle">auditok</text>
      </g>
      <!-- Card B (Stacked) -->
      <g transform="rotate(4)">
        <rect x="15" y="-5" width="115" height="44" rx="8" fill="#EEF3EF" stroke="#2A9D8F" stroke-width="1.5"/>
        <text x="72" y="21" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#15333C" text-anchor="middle">whisper</text>
      </g>
      <!-- Small Pill Tag -->
      <rect x="30" y="48" width="90" height="20" rx="10" fill="#2A9D8F" fill-opacity=".3" stroke="#9FE0CF" stroke-opacity=".4"/>
      <text x="75" y="62" font-family="ui-rounded,system-ui,sans-serif" font-size="10" font-weight="700" fill="#9FE0CF" text-anchor="middle">Lego Glue</text>
    </g>

    <!-- Target Pin & Destination Ring Pulses -->
    <circle class="ring" cx="1150" cy="132" r="28" fill="none" stroke="#F4704F" stroke-width="2"/>
    <circle class="ring ring2" cx="1150" cy="132" r="28" fill="none" stroke="#9FE0CF" stroke-width="1.5"/>
    
    <!-- Destination Pin -->
    <g class="pin">
      <path d="M1150 136 c-14-18-22-28-22-40 a22 22 0 0 1 44 0 c0 12-8 22-22 40z" fill="#F4704F"/>
      <circle cx="1150" cy="96" r="8" fill="#0F2229"/>
    </g>

    <!-- Target Destination Label -->
    <text x="1150" y="172" font-family="ui-rounded,'SF Pro Rounded',sans-serif" font-size="13" font-weight="700" fill="#9FE0CF" text-anchor="middle" letter-spacing="0.5">PRISTINE BUILD</text>
    <text x="1150" y="190" font-family="ui-monospace,monospace" font-size="10.5" fill="#EEF3EF" fill-opacity=".6" text-anchor="middle">zero scrap · verified</text>

    <!-- Flying Capsule along the Path -->
    <g class="pip">
      <g class="bob">
        <rect x="-14" y="-14" width="28" height="28" rx="8" fill="#0A1A20" stroke="#9FE0CF" stroke-width="1.8"/>
        <!-- Shield icon inside capsule -->
        <path d="M-5 -4 L0 -7 L5 -4 L5 2 L0 6 L-5 2 Z" fill="#F4704F"/>
      </g>
    </g>
  </g>

  <!-- Fine Outer Stroke -->
  <rect x=".5" y=".5" width="1279" height="479" rx="27.5" fill="none" stroke="#9FE0CF" stroke-opacity=".14"/>
</svg>